[project]
name = "wepenerd-experimental"
version = "0.2.0"
description = "Experimental 3D and video utilities for ComfyUI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["Pillow", "numpy"]


[project.optional-dependencies]
render3d = ["trimesh", "pyrender", "PyOpenGL", "pyglet"]

[project.urls]
Repository = "https://github.com/WepeNerd/ComfyUI-WepeNerd-Experimental"
Issues = "https://github.com/WepeNerd/ComfyUI-WepeNerd-Experimental/issues"
